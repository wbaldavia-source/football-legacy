name: Sync licensed football data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/real-world-engine
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch league and club data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/sync-football-data.mjs
      - name: Commit synchronized data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/live-football.json
          git diff --cached --quiet || (git commit -m "data: sync licensed football clubs and leagues" && git push)
